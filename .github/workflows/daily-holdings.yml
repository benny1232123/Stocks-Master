name: 每日持仓分析推送

on:
  schedule:
    # 到点自检轮询：UTC 10:00~13:40 每 20 分钟一槽（北京 18:00~21:40）。
    # 实测 GitHub Actions schedule 排队延迟可达 7~10 小时（2026-08-27/28/31 推到北京凌晨），
    # 单点 cron 不可靠；改为高频槽位 + job 内自检。
    # ⚠️ 2026-09-15 改：gate **不再设时间窗**（原「NOW<1830 就空转」会把漂移到凌晨的槽位
    # 整天漏推且报 success）。现只做「以 15:00 为界推导信号日 + 当天 artifact 防重」，
    # 任意时刻执行都能落到正确信号日；已推送的槽位秒级空转（gate 内 curl 一次 API），
    # 不触发 checkout / 装依赖，不消耗执行时间。
    - cron: "*/20 10-13 * * 1-5"
  workflow_dispatch:
    inputs:
      signal_date:
        description: '信号日 YYYYMMDD（留空 = 今天）。用于补跑某天持仓分析。'
        required: false
        default: ''
        type: string

concurrency:
  group: daily-holdings
  cancel-in-progress: false  # 排队模式：与精准触发共存，后来者经 gate/防重自动跳过

jobs:
  holdings-analysis:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write  # 回写持仓日报到仓库（Render 看板才能读到）
    env:
      TDX_ENABLED: "0"
      # 同花顺官方 Financial-API：有 Key 时云端最快首选；缺失时 kline.py 回退链降级到 akshare/baostock。
      HITHINK_FINANCE_API_KEY: ${{ secrets.HITHINK_FINANCE_API_KEY }}
    steps:
      - name: 当天防重 + 信号日
        id: gate
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ -n "${{ github.event.inputs.signal_date }}" ]; then
            # 手动补跑：跳过防重与信号日推导，任意时刻执行
            TODAY="${{ github.event.inputs.signal_date }}"
            echo "手动补跑信号日: $TODAY"
          else
            NOW=$(TZ=Asia/Shanghai date +%H%M)
            # 信号日 = 「最近一个已收盘的自然日」：以 A 股收盘 15:00 为界，
            # 15:00 之前（含 schedule 漂移到次日凌晨的情况）取上一自然日。
            # ⚠️ 原实现是「只判下限 NOW<1830 → 空转」，没有上限；一旦 GitHub schedule 把
            # 18:00~21:40 的槽位推迟几小时（实测 run 34867404309 漂到北京 00:15），当天就
            # **整天漏推**，而且 job 仍报 success（步 3/4/5/6/8 全 skipped、仅 8s）——静默失败，
            # 看 Actions 页面是绿的、不翻日志根本发现不了。
            # 现改为「不设时间窗 + 以 15:00 为界推导信号日 + 当天 artifact 防重」：
            # 任意时刻执行都能落到正确信号日，重复槽位由防重秒级空转。
            if [ "$NOW" -lt "1500" ]; then
              TODAY=$(TZ=Asia/Shanghai date -d "yesterday" +%Y%m%d)
              echo "北京 $NOW 未收盘（或 schedule 漂移至凌晨）→ 信号日取上一自然日: $TODAY"
            else
              TODAY=$(TZ=Asia/Shanghai date +%Y%m%d)
              echo "北京 $NOW 已收盘 → 信号日: $TODAY"
            fi
            # 防重：当天 artifact 已存在 = 已推送过，跳过（秒级空转）
            N=$(curl -s -H "Authorization: Bearer $GH_TOKEN" \
                "https://api.github.com/repos/${{ github.repository }}/actions/artifacts?per_page=100&name=holdings-analysis-$TODAY" \
                | grep -o '"total_count":[0-9]*' | head -1 | cut -d: -f2)
            if [ "${N:-0}" -gt 0 ] 2>/dev/null; then
              echo "当天 artifact holdings-analysis-$TODAY 已存在（已推送），跳过"
              echo "ok=false" >> $GITHUB_OUTPUT
              exit 0
            fi
          fi
          echo "ok=true" >> $GITHUB_OUTPUT
          echo "today=$TODAY" >> $GITHUB_OUTPUT

      - uses: actions/checkout@v4
        if: steps.gate.outputs.ok == 'true'

      - uses: actions/setup-python@v5
        if: steps.gate.outputs.ok == 'true'
        with:
          python-version: "3.11"

      - name: 安装依赖
        if: steps.gate.outputs.ok == 'true'
        run: |
          pip install --upgrade pip
          pip install --retries 3 numpy pandas pyarrow akshare baostock supabase requests

      - name: 生成持仓个股分析并推送
        if: steps.gate.outputs.ok == 'true'
        env:
          TODAY: ${{ steps.gate.outputs.today }}
          KLINE_BACKEND: hithink
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          TRADES_BACKEND: auto
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          SMTP_TO: ${{ secrets.SMTP_TO }}
        run: |
          python scripts/notify_holdings_analysis.py
          F="stock_data/holdings_analysis_${{ steps.gate.outputs.today }}.html"
          echo "### 持仓分析产出" >> $GITHUB_STEP_SUMMARY
          if [ -f "$F" ]; then
            echo "✅ 已生成美观 HTML 报告: $F" >> $GITHUB_STEP_SUMMARY
          else
            echo "::warning::未生成报告文件 $F" >> $GITHUB_STEP_SUMMARY
          fi

      - name: 上传分析报告
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: holdings-analysis-${{ steps.gate.outputs.today || 'skip' }}
          path: |
            stock_data/holdings_analysis_*.md
            stock_data/holdings_analysis_*.html
          retention-days: 30
          if-no-files-found: warn

      - name: 回写报告到仓库（Render 从仓库读，artifact 它看不到）
        if: steps.gate.outputs.ok == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          ls stock_data/holdings_analysis_*.md >/dev/null 2>&1 && git add -f stock_data/holdings_analysis_*.md || true
          ls stock_data/holdings_analysis_*.html >/dev/null 2>&1 && git add -f stock_data/holdings_analysis_*.html || true
          if git diff --cached --quiet; then
            echo "无报告变更，跳过提交"
            exit 0
          fi
          git commit -m "data: 持仓日报 $(TZ=Asia/Shanghai date +%Y%m%d)"
          # 三层推送容错（与 daily-pick 同款）
          PUSH_OK=0
          for i in 1 2 3; do
            if git pull --rebase --autostash origin master 2>/dev/null && git push origin master; then
              PUSH_OK=1
              echo "报告已回写仓库"
              break
            fi
            echo "推送失败，$((i*5))s 后重试 ($i/3)"
            sleep $((i*5))
          done
          [ "$PUSH_OK" != "1" ] && echo "::warning::报告回写推送失败（artifact 仍可用，可手动重推）"
          exit 0
