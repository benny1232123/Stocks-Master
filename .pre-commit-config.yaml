# detect-secrets pre-commit configuration (team standard)
# Local enforcement uses .git/hooks/pre-commit (absolute path to managed venv's detect-secrets-hook).
# For collaborators after clone: pip install detect-secrets pre-commit && pre-commit install
repos:
  - repo: https://github.com/Yelp/detect-secrets
    rev: v1.5.0
    hooks:
      - id: detect-secrets
        args: ['--baseline', '.secrets.baseline']
        exclude: ^\.secrets\.baseline$
