services:
  - type: web
    name: stocks-master
    env: python
    plan: free
    branch: master
    buildCommand: cd frontend && npm install && npm run build && cd .. && pip install -r requirements.txt
    startCommand: uvicorn backend.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /
    envVars:
      - key: KLINE_BACKEND
        value: akshare
      - key: TDX_ENABLED
        value: "0"
      - key: TRADES_BACKEND
        value: auto
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_KEY
        sync: false
      # ── 持仓管理 /admin ──
      # ADMIN_PASSWORD：管理端登录密码。未设置则 /admin 与 /api/admin/* 整体禁用（安全默认）。
      # API_AUTH_TOKEN：保护 /api/trades 等普通写接口。未设置时这些接口完全无鉴权。
      # 两者均为密钥，sync: false → 不写入仓库，需在 Render Dashboard 手动填值。
      - key: ADMIN_PASSWORD
        sync: false
      - key: API_AUTH_TOKEN
        sync: false
