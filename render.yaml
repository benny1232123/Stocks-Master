services:
  - type: web
    name: stocks-master
    env: python
    plan: free
    branch: master
    # vite 经 node 直接调用（不走 .bin 垫片）：Render 构建环境曾出现垫片
    # Permission denied（npm ci/chmod 均无效），node 直调绕开可执行位问题
    buildCommand: cd frontend && npm ci && npm run build && cd .. && pip install -r requirements.txt
    startCommand: uvicorn backend.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /
    envVars:
      # Python 版本声明（原 runtime.txt 已删——CF Pages 会误检测去装 Python 导致构建失败）
      - key: PYTHON_VERSION
        value: 3.12.3
      - key: KLINE_BACKEND
        value: akshare
      - key: TDX_ENABLED
        value: "0"
      # 候选池全市场扫描在 512MB 实例上会 OOM（ak.stock_zh_a_spot 全市场快照），
      # 云端关闭：候选池保持空，本地跑扫描后提交缓存即可
      - key: CANDIDATE_SCAN_BG
        value: "0"
      - key: TRADES_BACKEND
        value: auto
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_KEY
        sync: false
      # ── 持仓管理 /admin ──
      # ADMIN_PASSWORD：管理端登录密码。未设置则 /admin 与 /api/admin/* 整体禁用（安全默认）。
      # API_AUTH_TOKEN：保护 /api/trades 等普通写接口。未设置时这些接口完全无鉴权。
      # 两者均为密钥，sync: false → 不写入仓库，需在 Render Dashboard 手动填值。
      - key: ADMIN_PASSWORD
        sync: false
      - key: API_AUTH_TOKEN
        sync: false
