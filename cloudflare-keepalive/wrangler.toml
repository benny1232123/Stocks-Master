name = "stocks-master-keepalive"
main = "worker.js"
compatibility_date = "2026-08-01"

# 单一 Cron Trigger 同时驱动两件事：Render keep-alive + 持仓推送准时触发。
# 每 5 分钟一槽，只有落在窗口内才真正 dispatch（窗口由下方 vars 控制，北京时间）。
[triggers]
crons = ["*/5 * * * *"]

[vars]
# 定时触发目标：Stocks-Master 的「每日持仓分析推送」workflow
GITHUB_OWNER = "benny1232123"
GITHUB_REPO = "Stocks-Master"
GITHUB_WORKFLOW = "daily-holdings.yml"
GITHUB_REF = "master"

# 触发窗口（北京时间 HHMM，含起不含止）。
# 下限 18:30 = 等 A 股当日收盘数据落地；上限 19:00 = 只在该半小时内尝试，
# 避免 5 分钟轮询反复触发（另由 artifact 防重 + 最近 run 守卫双重兜底）。
DISPATCH_HOLDINGS_WINDOW_START = "1830"
DISPATCH_HOLDINGS_WINDOW_END = "1900"

# 最近 N 分钟内已有该 workflow 的 run → 视为已触发，跳过（防重复 dispatch）
DISPATCH_RECENT_RUN_GUARD_MIN = "30"

# 访问令牌走 Secret（不进仓库）：
#   npx wrangler secret put GH_DISPATCH_TOKEN
# 需要 Actions: write 权限（fine-grained PAT 或 classic PAT 勾 repo + workflow）
